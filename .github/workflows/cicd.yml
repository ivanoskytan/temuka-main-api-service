name: Build and Deploy Temuka Main API Service to Azure

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Image via ACR
        run: |
          az acr build \
            --registry temukaacr \
            --resource-group temuka \
            --image temuka-main-api:${{ github.sha }} \
            --image temuka-main-api:latest \
            .

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: temuka-main-api
          resourceGroup: mental-health-ugm-chatbot
          imageToDeploy: temukaacr.azurecr.io/temuka-main-api:${{ github.sha }}